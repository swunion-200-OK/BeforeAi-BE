# 로컬 개발용 (SPRING_PROFILES_ACTIVE=local)
# localhost에서 내부망 전용 API를 쓸 수 있도록 루프백도 내부망으로 봄
network.internal-cidrs=100.64.0.0/10,127.0.0.1/32,0:0:0:0:0:0:0:1/128
# HTTP로 리프레시 쿠키를 주고받기 위해 Secure를 끔
auth.refresh-cookie.secure=false
# 로컬 프론트 개발 서버 (포트 무관)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
# 시드 계정 비밀번호 (LocalSeedDataRunner)
seed.password=${SEED_PASSWORD}
