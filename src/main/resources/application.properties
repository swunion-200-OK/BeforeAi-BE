spring.application.name=BeforeAI-BE

# 리버스 프록시(Nginx/Cloudflare/tailscale serve) 뒤에서 X-Forwarded-* 를 인식(https 판별, 호스트 등)
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT. 비밀키는 32바이트 이상이어야 하며 환경변수로만 받음
jwt.secret=${JWT_SECRET}
jwt.access-token-ttl=15m
jwt.temporary-token-ttl=5m

# 리프레시 토큰(HttpOnly 쿠키)
auth.refresh-token-ttl=14d
auth.external-idle-timeout=30m
auth.refresh-cookie.secure=${AUTH_REFRESH_COOKIE_SECURE:true}

# 브라우저에서 호출을 허용할 프론트 출처 (쉼표 구분, 패턴 가능). 비어 있으면 같은 출처만 허용
# 기본값으로 배포 프론트(Cloudflare Pages) 출처를 허용. 프리뷰 서브도메인까지 커버
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://swunion.pages.dev,https://*.swunion.pages.dev,http://localhost:*,http://127.0.0.1:*} 

# 내부망으로 보는 출발지 IP 대역 (쉼표 구분). 기본값은 Tailscale 대역
network.internal-cidrs=${INTERNAL_CIDRS:100.64.0.0/10}

# 리버스 프록시(Nginx/tailscale serve) 뒤에서 운영할 때 true. 그러면 아래 헤더로 INTERNAL/EXTERNAL을 판별한다.
# 외부 프록시는 이 헤더를 external로, 내부 프록시는 internal로 '항상 덮어써야' 위조를 막을 수 있다.
network.trust-proxy-header=${NETWORK_TRUST_PROXY_HEADER:false}
network.trusted-header=${NETWORK_TRUSTED_HEADER:X-Access-Network}

# 클라이언트가 고정(pinning)할 웹쉘 공개키 (Base64). 비어 있으면 /webshell/public-key는 502 WEBSHELL_UNAVAILABLE
webshell.encryption-public-key=${WEBSHELL_ENCRYPTION_PUBLIC_KEY:}
webshell.signing-public-key=${WEBSHELL_SIGNING_PUBLIC_KEY:}

# 웹쉘 주소(내부망, 예: https://webshell.internal:8443)와 mTLS 클라이언트 인증서를 담은 SSL 번들 이름.
# 번들은 spring.ssl.bundle.pem.<이름>.keystore.* / truststore.* 로 등록함. 주소가 비어 있으면 웹쉘 호출(kill)은 502 WEBSHELL_UNAVAILABLE
webshell.base-url=${WEBSHELL_BASE_URL:}
webshell.ssl-bundle=${WEBSHELL_SSL_BUNDLE:}

# 웹쉘 → 웹 서비스 콜백(/api/v1/internal/**)은 웹쉘 클라이언트 인증서(mTLS)로 인증함.
# 운영에서는 SERVER_SSL_ENABLED=true와 SERVER_SSL_BUNDLE(서버 인증서 + 웹쉘 CA 신뢰 저장소를 담은 SSL 번들 이름)을 지정함.
# client-auth=want라 브라우저 API는 인증서 없이 그대로 쓰고, 콜백 경로만 인증서를 요구함
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.client-auth=want
# 콜백을 허용할 웹쉘 클라이언트 인증서 CN. 비어 있으면 모든 콜백이 401 UNAUTHENTICATED
webshell.callback-client-cn=${WEBSHELL_CALLBACK_CLIENT_CN:}
# AI 분석기 (AWS Bedrock, Claude Sonnet 5.5). enabled=false면 분석기 미동작(요청은 ANALYZING에서 수동 편집만).
bedrock.enabled=${BEDROCK_ENABLED:false}
# 리전은 서버(EC2/IAM/환경)에 설정됨. 비우면 SDK 기본 리전 체인을 따름.
bedrock.region=${BEDROCK_REGION:}
# Sonnet 5.5 는 cross-Region inference profile ID 로 호출. global 프로필만 제공됨(apac 없음).
bedrock.model-id=${BEDROCK_MODEL_ID:global.anthropic.claude-sonnet-5-5}
bedrock.max-tokens=${BEDROCK_MAX_TOKENS:4096}
# temperature 음수면 전송 안 함. Sonnet 5.5 등 최신 모델은 temperature를 지원하지 않으므로 기본 -1.
bedrock.temperature=${BEDROCK_TEMPERATURE:-1}
bedrock.timeout-seconds=${BEDROCK_TIMEOUT_SECONDS:60}
# 감사 로그 내보내기 최대 건수 (CORE-13). 넘으면 422 EXPORT_TOO_LARGE
audit.export.max-rows=100000
