# 테스트 전용 값. classpath:/config/ 위치라 main의 application.properties를 가리지 않고 덮어쓰기만 함
jwt.secret=test-only-jwt-secret-key-32-bytes-or-more!!
auth.refresh-cookie.secure=false
# 테스트용 공개키(32바이트 0을 Base64로 인코딩한 값). 실제 키가 아님
webshell.encryption-public-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
webshell.signing-public-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
cors.allowed-origins=http://localhost:5173
webshell.policy-stub=true
webshell.policy-retry-enabled=false
# 테스트에선 상태 변화 webhook 발송을 끔. @Async + AFTER_COMMIT 발송이 테스트 트랜잭션 밖에서
# 실제 HTTP를 시도하지 않도록 한다(외부 의존·지연 방지).
webhook.enabled=false
