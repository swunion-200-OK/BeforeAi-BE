name: CD

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # bootJar만 빌드한다. 테스트는 CI(dev/PR)에서 이미 수행됐다.
      - name: Build bootJar
        run: ./gradlew clean bootJar -x test

      - name: Resolve jar path
        id: jar
        run: echo "path=$(ls build/libs/*.jar | grep -v plain | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: ${{ steps.jar.outputs.path }}
          target: /home/${{ secrets.EC2_USER }}/app/incoming
          strip_components: 2

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            set -e
            APP_DIR="/home/${{ secrets.EC2_USER }}/app"
            NEW_JAR=$(ls -t "$APP_DIR"/incoming/*.jar | head -n 1)

            # 롤백용으로 직전 jar 백업
            if [ -f "$APP_DIR/app.jar" ]; then
              cp "$APP_DIR/app.jar" "$APP_DIR/app.jar.bak"
            fi

            cp "$NEW_JAR" "$APP_DIR/app.jar"
            rm -f "$APP_DIR"/incoming/*.jar

            sudo systemctl restart beforeai

            echo "Waiting for health check..."
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "Deploy succeeded: application is UP"
                exit 0
              fi
              sleep 5
            done

            echo "Health check failed, rolling back"
            if [ -f "$APP_DIR/app.jar.bak" ]; then
              cp "$APP_DIR/app.jar.bak" "$APP_DIR/app.jar"
              sudo systemctl restart beforeai
            fi
            sudo journalctl -u beforeai --no-pager -n 80
            exit 1
