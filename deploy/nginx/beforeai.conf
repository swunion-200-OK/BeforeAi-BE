# BeforeAI-BE 외부 경로(Nginx) 설정
# Cloudflare(도메인) → EC2:443 → 127.0.0.1:8080 (Spring Boot)
#
# 배치: /etc/nginx/sites-available/beforeai.conf
#   sudo ln -s /etc/nginx/sites-available/beforeai.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 핵심:
#  - 이 경로로 들어오는 트래픽은 '외부'다. X-Access-Network 를 항상 external 로 덮어써
#    클라이언트가 internal 로 위조하는 것을 막는다. (앱의 network.trust-proxy-header=true 와 짝)
#  - SSE(/logs/stream, /progress/stream)는 버퍼링을 꺼야 실시간으로 흐른다.
#  - WebSocket(Upgrade) 전달.
#  - 리프레시 토큰이 HttpOnly+Secure 쿠키라 HTTPS 필수(Cloudflare Full/Strict 권장).

upstream beforeai_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

# http -> https (Cloudflare Flexible이 아니라 Full/Strict 가정)
server {
    listen 80;
    server_name swunion-server.siyoung.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name swunion-server.siyoung.site;

    # TODO: 인증서 경로. Cloudflare Origin Certificate 또는 Let's Encrypt
    ssl_certificate     /etc/ssl/beforeai/origin.pem;
    ssl_certificate_key /etc/ssl/beforeai/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 업로드/기획서 본문 여유
    client_max_body_size 20m;

    location / {
        proxy_pass http://beforeai_app;
        proxy_http_version 1.1;

        # --- 외부 경로 표식: 들어온 값 무시하고 항상 external 로 강제(위조 방지) ---
        proxy_set_header X-Access-Network external;

        # 표준 프록시 헤더 (Spring forward-headers-strategy=framework 가 읽음)
        # 감사 로그 IP 는 앱이 X-Forwarded-For 의 첫 IP 를 쓴다.
        # Cloudflare 를 거치면 실제 방문자 IP 가 CF-Connecting-IP 로 오므로 그것을 XFF 맨 앞에 둔다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $cf_or_remote;
        proxy_set_header X-Forwarded-For   $cf_or_remote;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # SSE 스트림: 버퍼링 끄고 타임아웃 길게
    location ~ ^/api/v1/requests/.+/(logs|progress)/stream$ {
        proxy_pass http://beforeai_app;
        proxy_http_version 1.1;

        proxy_set_header X-Access-Network external;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $cf_or_remote;
        proxy_set_header X-Forwarded-For   $cf_or_remote;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# $connection_upgrade 매핑 (http 블록의 map. 이미 다른 conf에 있으면 중복 제거)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 실제 방문자 IP: Cloudflare 를 거치면 CF-Connecting-IP 에 들어온다. 없으면 소켓 remote_addr.
# 감사 로그에 쓰일 X-Forwarded-For / X-Real-IP 의 값으로 사용.
map $http_cf_connecting_ip $cf_or_remote {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
