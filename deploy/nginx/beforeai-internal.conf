# BeforeAI-BE 내부 경로(Tailscale) 설정
# tailscale serve(https, :443 on tailnet) → 127.0.0.1:8081 (이 Nginx) → 127.0.0.1:8080 (앱)
#
# tailscale serve 는 커스텀 헤더(X-Access-Network)를 붙여 주지 못하므로,
# 내부 전용 Nginx 입구(127.0.0.1:8081)를 하나 더 두고 여기서 internal 을 찍는다.
# 이 포트는 루프백에만 bind 하여 외부/타 경로에서 직접 닿지 못하게 한다.
#
# 배치: /etc/nginx/sites-available/beforeai-internal.conf 로 두고 symlink + reload.

server {
    # 루프백 전용. tailscale serve 만 여기로 프록시한다.
    listen 127.0.0.1:8081;
    server_name _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # --- 내부 경로 표식: 항상 internal 로 강제 ---
        proxy_set_header X-Access-Network internal;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/v1/requests/.+/(logs|progress)/stream$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header X-Access-Network internal;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
